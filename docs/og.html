<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  *{margin:0;box-sizing:border-box}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{background:radial-gradient(120% 140% at 78% 12%, #2a2115 0%, #0d0c0b 55%);
    color:#efe6d4;font-family:"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC",sans-serif;
    padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between}
  .top .mark{font-weight:800;letter-spacing:.32em;font-size:26px}
  .top .mark .d{color:#d9a94e}
  .top .kick{color:#d9a94e;letter-spacing:.3em;font-size:15px;font-weight:600;text-transform:uppercase;margin-top:20px}
  h1{font-size:66px;line-height:1.08;letter-spacing:-.015em;margin:16px 0 0;max-width:20ch}
  h1 .g{color:#e7c67f}
  .sub{color:#b3a889;font-size:24px;margin-top:22px;max-width:40ch;line-height:1.5}
  .row{display:flex;align-items:center;justify-content:space-between}
  .chips{display:flex;gap:14px}
  .chip{border:1px solid #4a4030;border-radius:999px;padding:9px 18px;font-size:17px;color:#d9c9a6}
  .url{color:#d9a94e;font-size:20px;font-weight:600;letter-spacing:.02em}
</style></head><body>
  <div class="top">
    <div class="mark">ARCH<span class="d"> · </span>RENDER</div>
    <div class="kick">Architectural rendering agent</div>
    <h1>Massing screenshot → <span class="g">photorealistic render</span>.</h1>
    <div class="sub">On your own ChatGPT / Gemini. Faithful, quota-saving, tamper-checked.</div>
  </div>
  <div class="row">
    <div class="chips">
      <div class="chip">🎯 Geometry locked</div>
      <div class="chip">💸 No API key</div>
      <div class="chip">🖥️ Runs locally</div>
      <div class="chip">🆓 MIT</div>
    </div>
    <div class="url">github.com/…/arch-render-agent</div>
  </div>
</body></html>
